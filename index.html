<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一水千田｜桃園大圳水文化</title>
  <meta name="description" content="《一水千田》：用桌遊、互動地圖和小遊戲，認識桃園大圳與千塘之鄉的水文化。">
  <meta name="theme-color" content="#2b7bb9">
  <link rel="icon" href="images/drop.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <!-- 3D 模型用的套件位置：全部指向同一份 three.js 和 Vue，避免重複載入 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.170.0?target=es2022",
      "vue": "https://esm.sh/vue@3.5.13?target=es2022",
      "@pmndrs/pointer-events": "https://esm.sh/@pmndrs/pointer-events@6.6.17?external=three&target=es2022",
      "@tresjs/core": "https://esm.sh/@tresjs/core@5.8.1?external=three,vue,@pmndrs/pointer-events&target=es2022"
    }
  }
  </script>
</head>
<body class="page-home">
  <!-- ★ 這一頁的文字不寫在這裡：要修改內容，請改 data/home.js -->
  <header id="site-nav" class="nav"></header>
  <main id="app"></main>
  <footer id="site-footer"></footer>
  <noscript><p class="noscript">這個網站需要開啟 JavaScript 才能顯示內容。</p></noscript>

  <script src="data/site.js"></script>
  <script src="data/home.js"></script>
  <!-- 後台草稿預覽：一定要放在資料檔之後、render.js 之前 -->
  <script src="js/cms.js"></script>
  <script src="js/render.js"></script>

  <!-- 3D 模型：資料（tres-data.js）和程式（tres-scene.js）。不想要 3D 時，刪掉這兩行和 data/home.js 裡的 model3d 區塊 -->
  <script src="tres-data.js"></script>
  <script src="tres-scene.js"></script>
</body>
</html>
